[project]
name = "foresight-win"
version = "0.1.0"
description = "Offline meeting notetaker for Windows: Gemma 4 transcription and notes, EmbeddingGemma 2 search, all local via llama.cpp"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "numpy>=2.0",
    "soxr>=0.5",
    "soundfile>=0.12.1",
    "av>=14",
    "pypdf>=5",
    "python-docx>=1.1",
    "pywebview>=5.3",
    "pyaudiowpatch>=0.2.12.7; sys_platform == 'win32'",
]

[project.scripts]
foresight = "foresight.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["foresight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
